databases:
  - name: nitpyalumni-db
    # Preserve the existing production compute plan during Blueprint sync.
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: nitpyalumni
    runtime: python
    # Preserve the existing production compute plan during Blueprint sync.
    region: oregon
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn project.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nitpyalumni-db
          property: connectionString
