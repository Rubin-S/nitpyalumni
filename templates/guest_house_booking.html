{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Guest House Booking</h2>
    <div class="card p-4 shadow-sm">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Type of Room</label>
                <select name="type_of_room" class="form-select" required>
                    <option value="">Select Room Type</option>
                    <option value="Single">Single Room</option>
                    <option value="Double">Double Room</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Reason of Visit</label>
                <textarea name="reason_of_visit" class="form-control" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Check-In Date & Time</label>
                <input type="datetime-local" name="datetime_in" class="form-control" id="datetime_in" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Check-Out Date & Time</label>
                <input type="datetime-local" name="datetime_out" class="form-control" id="datetime_out" required>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Submit Request</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const now = new Date();
        const future = new Date();
        future.setDate(future.getDate() + 547); // ~1.5 years

        const minDate = now.toISOString().slice(0, 16);
        const maxDate = future.toISOString().slice(0, 16);

        const datetimeIn = document.getElementById("datetime_in");
        const datetimeOut = document.getElementById("datetime_out");

        datetimeIn.min = minDate;
        datetimeIn.max = maxDate;

        datetimeOut.min = minDate;
        datetimeOut.max = maxDate;

        // Optional: auto-update check-out min when check-in selected
        datetimeIn.addEventListener("change", function () {
            datetimeOut.min = this.value;
        });
    });
</script>
{% endblock %}
