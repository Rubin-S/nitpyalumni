{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Get Transcript</h2>
    <div class="card p-4 shadow-sm">
        {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="alert alert-info text-center" role="alert">
                Please click submit to request your transcript. Our team will process it and contact you soon.
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Request Transcript</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
