<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{error_code}} ~ {{error_message}} - NITPY Alumni</title>
    <link rel="icon" type="image/jpeg" href="/static/favicon.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            color: #343a40;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-box {
            padding: 2rem;
        }
        .error-box h1 {
            font-size: 5rem;
            font-weight: bold;
        }
        .error-box p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

<div class="error-box">
    <h1>{{error_code}}</h1>
    <p>{{error_message}}</p>
    <a href="/" class="btn btn-primary btn-lg">Return Home</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
