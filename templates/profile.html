{% extends 'base.html' %}
{% block title %}Profile | NITPY Alumni{% endblock %}

{% block content %}
<section class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm p-5">
          <h3 class="text-center mb-4 fw-bold">Your Profile</h3>
          {%if not is_approved %}
          <div class="alert alert-danger text-center">Your account is under approval</div>
          {%endif%}
          <form method="post">
            {% csrf_token %}
            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags }} text-center">
                  {{ message }}
                </div>
              {% endfor %}
            {% endif %}

            <div class="row">
              <!-- Name -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required value="{{ user_data.name }}">
              </div>

              <!-- Roll No -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text" name="roll_no" class="form-control" required value="{{ user_data.roll_no }}">
              </div>

              <!-- Phone -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone_number" class="form-control" required value="{{ user_data.phone_number }}">
              </div>

              <!-- Email -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Email ID</label>
                <input type="email" name="email_id" class="form-control" required value="{{ user_data.email_id }}">
              </div>

              <!-- Country -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Country</label>
                <input type="text" name="country" class="form-control" required value="{{ user_data.country }}">
              </div>

              <!-- State -->
              <div class="col-md-6 mb-3">
                <label class="form-label">State</label>
                <input type="text" name="state" class="form-control" required value="{{ user_data.state }}">
              </div>

              <!-- City -->
              <div class="col-md-6 mb-3">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-control" required value="{{ user_data.city }}">
              </div>

              <!-- Batch -->
              <!-- Batch -->
            <div class="col-md-6 mb-3">
                <label class="form-label">Batch (Passout year) </label>
                <select name="batch" class="form-select" required>
                    <option disabled>Select Batch (Passout year)</option>
                    <option value="2018" {% if user_data.batch == 2018 %}selected{% endif %}>2018</option>
                    <option value="2019" {% if user_data.batch == 2019 %}selected{% endif %}>2019</option>
                    <option value="2020" {% if user_data.batch == 2020 %}selected{% endif %}>2020</option>
                    <option value="2021" {% if user_data.batch == 2021 %}selected{% endif %}>2021</option>
                    <option value="2022" {% if user_data.batch == 2022 %}selected{% endif %}>2022</option>
                    <option value="2023" {% if user_data.batch == 2023 %}selected{% endif %}>2023</option>
                    <option value="2024" {% if user_data.batch == 2024 %}selected{% endif %}>2024</option>
                    <option value="2025" {% if user_data.batch == 2025 %}selected{% endif %}>2025</option>
                    <option value="2026" {% if user_data.batch == 2026 %}selected{% endif %}>2026</option>
                    <option value="2027" {% if user_data.batch == 2027 %}selected{% endif %}>2027</option>
                    <option value="2028" {% if user_data.batch == 2028 %}selected{% endif %}>2028</option>
                    <option value="2029" {% if user_data.batch == 2029 %}selected{% endif %}>2029</option>
                    <option value="2030" {% if user_data.batch == 2030 %}selected{% endif %}>2030</option>
                  </select>
                  
            </div>
            

              <!-- Degree -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Degree</label>
                <select name="degree" class="form-select" required>
                  <option disabled selected>Select your Degree</option>
                  <option value="B.Tech" {% if user_data.degree == "B.Tech" %}selected{% endif %}>B.Tech</option>
                  <option value="M.Tech" {% if user_data.degree == "M.Tech" %}selected{% endif %}>M.Tech</option>
                  <option value="Ph.D" {% if user_data.degree == "Ph.D" %}selected{% endif %}>Ph.D</option>
                  <option value="B.Sc. B.Ed" {% if user_data.degree == "B.Sc. B.Ed" %}selected{% endif %}>B.Sc. B.Ed</option>
                  <option value="M.Sc" {% if user_data.degree == "M.Sc" %}selected{% endif %}>M.Sc</option>
                </select>
              </div>

              <!-- Department -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Department</label>
                <select name="department" class="form-select" required>
                  <option disabled selected>Select Department</option>
                  <option value="Computer Science Engineering" {% if user_data.department == "Computer Science Engineering" %}selected{% endif %}>Computer Science Engineering</option>
                  <option value="Electronics and Communication Engineering" {% if user_data.department == "Electronics and Communication Engineering" %}selected{% endif %}>Electronics and Communication Engineering</option>
                  <option value="Electrical and Electronics Engineering" {% if user_data.department == "Electrical and Electronics Engineering" %}selected{% endif %}>Electrical and Electronics Engineering</option>
                  <option value="Mechanical Engineering" {% if user_data.department == "Mechanical Engineering" %}selected{% endif %}>Mechanical Engineering</option>
                  <option value="Civil Engineering" {% if user_data.department == "Civil Engineering" %}selected{% endif %}>Civil Engineering</option>
                  <option value="Physics" {% if user_data.department == "Physics" %}selected{% endif %}>Physics</option>
                  <option value="Chemistry" {% if user_data.department == "Chemistry" %}selected{% endif %}>Chemistry</option>
                  <option value="Mathematics" {% if user_data.department == "Mathematics" %}selected{% endif %}>Mathematics</option>
                  <option value="Humanities" {% if user_data.department == "Humanities" %}selected{% endif %}>Humanities</option>
                </select>
              </div>

              <!-- Present Address -->
              <div class="col-md-12 mb-3">
                <label class="form-label">Present Address</label>
                <textarea name="present_address" class="form-control" rows="2" required>{{ user_data.present_address }}</textarea>
              </div>

              <!-- LinkedIn -->
              <div class="col-md-12 mb-3">
                <label class="form-label">LinkedIn Profile (Optional)</label>
                <input type="url" name="linkedin" class="form-control" value="{{ user_data.linkedin }}">
              </div>

              <!-- Facebook -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Facebook Profile (Optional)</label>
                <input type="url" name="facebook" class="form-control" value="{{ user_data.facebook }}">
              </div>

              <!-- Instagram -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Instagram Profile (Optional)</label>
                <input type="url" name="instagram" class="form-control" value="{{ user_data.instagram }}">
              </div>

              <!-- Current Status -->
              <div class="col-md-12 mb-4">
                <label class="form-label">Currently</label>
                <select class="form-select" id="current_status" name="current_status" onchange="toggleFields()" required>
                  <option value="">-- Select --</option>
                  <option value="job" {% if user_data.current_status == "job" %}selected{% endif %}>Working</option>
                  <option value="study" {% if user_data.current_status == "study" %}selected{% endif %}>Pursuing Higher Studies</option>
                  <option value="none" {% if user_data.current_status == "none" %}selected{% endif %}>Neither</option>
                </select>
              </div>

              <!-- Job Fields -->
              <div id="job_fields" style="display: {% if user_data.current_status == 'job' %}block{% else %}none{% endif %};">
                <div class="mb-3">
                  <label class="form-label">Job Title</label>
                  <input type="text" name="job_title" class="form-control" value="{{ user_data.job_title }}">
                </div>
                <div class="mb-3">
                  <label class="form-label">Job Address</label>
                  <input type="text" name="job_address" class="form-control" value="{{ user_data.job_address }}">
                </div>
              </div>

              <!-- Higher Studies Fields -->
              <div id="study_fields" style="display: {% if user_data.current_status == 'study' %}block{% else %}none{% endif %};">
                <div class="mb-3">
                  <label class="form-label">University Name</label>
                  <input type="text" name="higher_study_uni_name" class="form-control" value="{{ user_data.higher_study_uni_name }}">
                </div>
                <div class="mb-3">
                  <label class="form-label">University Address</label>
                  <input type="text" name="higher_study_uni_address" class="form-control" value="{{ user_data.higher_study_uni_address }}">
                </div>
                <div class="mb-3">
                  <label class="form-label">Field of Study</label>
                  <input type="text" name="higher_study_field" class="form-control" value="{{ user_data.higher_study_field }}">
                </div>
              </div>

              <div class="d-grid mt-3">
                <button type="submit" class="btn btn-success">Update Profile</button>
              </div>

            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
function toggleFields() {
  var status = document.getElementById('current_status').value;
  document.getElementById('job_fields').style.display = (status === 'job') ? 'block' : 'none';
  document.getElementById('study_fields').style.display = (status === 'study') ? 'block' : 'none';
}
</script>
{% endblock %}
