<div style="font-family: Arial, sans-serif; padding: 20px;">
    <div style="background-color: #e0f2f1; border-radius: 8px; padding: 15px; margin-bottom: 20px;">
        <strong style="color: #00796b;">Subject:</strong>
        <div style="margin-top: 5px; font-size: 16px;">{{ subject }}</div>
    </div>

    <div style="background-color: #f1f8e9; border-left: 5px solid #8bc34a; padding: 15px; border-radius: 5px;">
        <p style="margin: 0; font-size: 16px; line-height: 1.5;">{{ message|linebreaksbr }}</p>
    </div>

    <hr style="margin: 30px 0;">

    <p style="font-size: 14px; color: #555;">
        Reply: 
        <a href="mailto:{{ sender.email }}" style="color: #007bff; text-decoration: none;">
            {{ sender.get_full_name }} ({{ sender.username }})
        </a>
    </p>
</div>
