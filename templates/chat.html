{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-3">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">{{ rc.name }}</h5>
    </div>
    <div id="chat-box" class="card-body" style="height: 500px; overflow-y: auto; background-color: #f1f1f1;">
        
</div>
<div id="date-popup" class="position-absolute px-3 py-1 bg-secondary text-white rounded shadow-sm" 
     style="top: 10px; left: 50%; transform: translateX(-50%); display: none; z-index: 10; opacity: 0.9; font-size: 0.9rem;">

      <!-- Messages will be appended here -->
    </div>
    <div class="card-footer d-flex">
      <input type="text" id="chat-input" class="form-control me-2" placeholder="Type a message..." />
      <button id="send-btn" class="btn btn-success">Send</button>
    </div>
  </div>
</div>
<script>
    const otherUserId = "{{ other_user_id }}";
    const userId = "{{ user.id }}";
    const csrfToken = '{{ csrf_token }}';
  
    let offset = 0;
    let allLoaded = false;
    const chatBox = document.getElementById('chat-box');
    const renderedMessages = new Set();
  
    // ======== Utility Functions ========
    function formatDateLabel(dateStr) {
      const msgDate = new Date(dateStr);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);
  
      const msgDay = new Date(msgDate.getFullYear(), msgDate.getMonth(), msgDate.getDate());
  
      if (msgDay.getTime() === today.getTime()) return "Today";
      if (msgDay.getTime() === yesterday.getTime()) return "Yesterday";
  
      return (msgDate.getFullYear() === now.getFullYear())
        ? msgDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit' })
        : msgDate.toLocaleDateString('en-GB');
    }
  
    function showDatePopup(datetimeStr) {
      const label = formatDateLabel(datetimeStr);
      const popup = document.getElementById('date-popup');
      popup.textContent = label;
      popup.style.display = 'block';
  
      clearTimeout(popup.dataset.timer);
      popup.dataset.timer = setTimeout(() => {
        popup.style.display = 'none';
      }, 3000);
    }
  
    // ======== Message Rendering ========
    function appendMessage(msg, isSender) {
      if (renderedMessages.has(msg._id)) return;
      renderedMessages.add(msg._id);
  
      showDatePopup(msg.datetime_sent);
  
      const bubble = document.createElement('div');
      bubble.className = `mb-2 d-flex ${isSender ? 'justify-content-end' : 'justify-content-start'}`;
      bubble.setAttribute('data-id', msg._id);
      bubble.innerHTML = `
        <div class="p-2 rounded" style="max-width: 75%; background-color: ${isSender ? '#DCF8C6' : '#FFF'};">
          <div>${msg.text}</div>
          <small class="text-muted">${new Date(msg.datetime_sent).toLocaleTimeString()}</small>
        </div>`;
      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  
    function prependMessage(msg) {
      if (renderedMessages.has(msg._id)) return;
      renderedMessages.add(msg._id);
  
      const isSender = msg.sender_id === userId;
      const scrollOffset = chatBox.scrollHeight - chatBox.scrollTop;
  
      const bubble = document.createElement('div');
      bubble.className = `mb-2 d-flex ${isSender ? 'justify-content-end' : 'justify-content-start'}`;
      bubble.setAttribute('data-id', msg._id);
      bubble.innerHTML = `
        <div class="p-2 rounded" style="max-width: 75%; background-color: ${isSender ? '#DCF8C6' : '#FFF'};">
          <div>${msg.text}</div>
          <small class="text-muted">${new Date(msg.datetime_sent).toLocaleTimeString()}</small>
        </div>`;
  
      showDatePopup(msg.datetime_sent);
      chatBox.insertBefore(bubble, chatBox.firstChild);
      chatBox.scrollTop = chatBox.scrollHeight - scrollOffset;
    }
  
    // ======== Loaders ========
    function loadInitialMessages() {
      fetch(`/chat/${otherUserId}/load?offset=${offset}`)
        .then(response => response.json())
        .then(data => {
          if (data.messages.length === 0) {
            const noMsg = document.createElement('div');
            noMsg.className = "text-center text-muted my-3";
            noMsg.textContent = "This is the start of your conversation.";
            chatBox.appendChild(noMsg);
            allLoaded = true;
            return;
          }
  
          data.messages.forEach(msg => appendMessage(msg, msg.sender_id === userId));
          offset += data.messages.length;
        });
    }
  
    function loadOlderMessages() {
      if (allLoaded) return;
      const prevScrollHeight = chatBox.scrollHeight;
  
      fetch(`/chat/${otherUserId}/load?offset=${offset}`)
        .then(response => response.json())
        .then(data => {
          if (data.messages.length === 0) {
            const noMsg = document.createElement('div');
            noMsg.className = "text-center text-muted my-3";
            noMsg.textContent = "This is the start of your conversation.";
            chatBox.insertBefore(noMsg, chatBox.firstChild);
            allLoaded = true;
            return;
          }
  
          data.messages.forEach(msg => prependMessage(msg));
          offset += data.messages.length;
        });
    }
  
    function pollNewMessages() {
      fetch(`/chat/${otherUserId}/update`)
        .then(response => response.json())
        .then(data => {
          data.messages.forEach(msg => {
            if (!renderedMessages.has(msg._id) && msg.is_seen === false) {
              appendMessage(msg, false);
            }
          });
        })
        .catch(err => console.error('Error fetching new messages:', err));
    }
  
    // ======== Sending Message ========
    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
  
      fetch(`/chat/${otherUserId}/add_message`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({ text: text })
      })
        .then(response => response.json())
        .then(data => {
          appendMessage({ _id: data._id, text: text, datetime_sent: new Date() }, true);
          input.value = '';
        });
    }
  
    // ======== Events ========
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });
  
    chatBox.addEventListener('scroll', () => {
      if (chatBox.scrollTop === 0 && !allLoaded) {
        loadOlderMessages();
      }
    });
  
    // ======== Boot ========
    loadInitialMessages();
    setInterval(pollNewMessages, 5000);
  </script>
    {% endblock %}
