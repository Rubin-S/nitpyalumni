{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Your Chats</h4>
    </div>
    <ul class="list-group list-group-flush" id="chat-list">
      <!-- Chats will be loaded here dynamically -->
      <li class="list-group-item text-muted">Loading chats...</li>
    </ul>
  </div>
</div>

<script>
  async function fetchChats() {
    try {
      const response = await fetch('/chats/partial');
      const data = await response.json();

      console.log(data)

      const chatList = document.getElementById('chat-list');
      chatList.innerHTML = '';  // Clear existing chats

      if (data.chats && data.chats.length > 0) {
        data.chats.forEach(chat => {
          // Create chat list item
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between align-items-center';

          const a = document.createElement('a');
          a.href = `/chat/${chat.other_user_id}`;
          a.className = 'text-decoration-none text-dark w-100 d-flex align-items-center';

          const div = document.createElement('div');
          div.className = 'flex-grow-1';

          if (chat.has_unseen) {
            const strong = document.createElement('strong');
            strong.textContent = chat.name;

            const badge = document.createElement('span');
            badge.className = 'badge bg-danger ms-2';
            badge.textContent = 'New';

            div.appendChild(strong);
            div.appendChild(badge);
            div.appendChild(document.createElement('br'));
          } else {
            div.textContent = chat.name;
            div.appendChild(document.createElement('br'));
          }

          const small = document.createElement('small');
          small.className = 'text-muted';
          small.textContent = new Date(chat.last_message_time).toLocaleString('en-US', {
            month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit'
          });

          div.appendChild(small);
          a.appendChild(div);
          li.appendChild(a);
          chatList.appendChild(li);
        });
      } else {
        chatList.innerHTML = '<li class="list-group-item text-muted">No chats found.</li>';
      }
    } catch (err) {
      console.error('Failed to fetch chats:', err);
    }
  }

  // Initial load
  fetchChats();

  // Poll every 2 seconds
  setInterval(fetchChats, 2000);
</script>
{% endblock %}
