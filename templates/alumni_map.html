{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h2>Alumni Map</h2>

  <!-- Search Bar -->
  <div class="mb-3">
    <input type="text" id="searchInput" class="form-control" placeholder="Search by name, roll no, city, batch, department, etc."/>
  </div>

  <!-- Map -->
  <div id="map" style="height: 500px;" class="mb-4"></div>

  <!-- Alumni Table -->
  <h4>Alumni in View</h4>
  <div class="table-responsive">
    <table class="table table-bordered" id="alumniTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Batch</th>
          <th>Department</th>
          <th>Current Position</th>
          <th>Contact</th>
        </tr>
      </thead>
      <tbody>
        <!-- Filled dynamically -->
      </tbody>
    </table>
  </div>
</div>

<!-- Leaflet JS & CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([10.964, 79.841], 13);
  const markerGroup = L.layerGroup().addTo(map);

  L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    attribution: '&copy; SierraMaps',
    maxZoom: 20
  }).addTo(map);

  let lastSearchQuery = '';
  const currentUserId = {{ request.user.pk|default:"null" }};

  function fetchAlumni(triggeredBy = 'map') {
    const bounds = map.getBounds();
    const search = document.getElementById('searchInput').value.trim();

    if (search !== '' && triggeredBy === 'map') return;
    if (search === lastSearchQuery && triggeredBy === 'search') return;
    if (triggeredBy === 'search') lastSearchQuery = search;

    const url = `?south=${bounds.getSouth()}&west=${bounds.getWest()}&north=${bounds.getNorth()}&east=${bounds.getEast()}&search=${encodeURIComponent(search)}`;

    fetch(url, {
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
    .then(response => response.json())
    .then(data => {
      markerGroup.clearLayers();
      const tbody = document.querySelector('#alumniTable tbody');
      tbody.innerHTML = '';

      if (search !== '' && data.alumni.length > 0 && triggeredBy === 'search') {
        const first = data.alumni[0];
        map.setView([first.lat, first.lng], map.getZoom());
      }

      data.alumni.forEach(alumni => {
        const marker = L.marker([alumni.lat, alumni.lng])
          .bindPopup(`<b>${alumni.name}</b><br>${alumni.department}<br>${alumni.job_title}`);
        markerGroup.addLayer(marker);

        const isCurrentUser = currentUserId === alumni.id;

        const nameText = isCurrentUser ? `${alumni.name} (You)` : alumni.name;
        const contactHTML = isCurrentUser
          ? `<span class="badge bg-secondary">This is you</span>`
          : `<a href="/contact-alumni/${alumni.id}" class="btn btn-sm btn-outline-primary">Contact</a>`;

        const row = `<tr>
          <td>${nameText}</td>
          <td>${alumni.batch}</td>
          <td>${alumni.department}</td>
          <td>${alumni.job_title}</td>
          <td>${contactHTML}</td>
        </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
      });
    });
  }

  function debounce(func, delay) {
    let timeout;
    return function (...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), delay);
    };
  }

  const debouncedSearch = debounce(() => fetchAlumni('search'), 300);

  document.getElementById('searchInput').addEventListener('input', debouncedSearch);
  map.on('moveend', () => fetchAlumni('map'));
  window.addEventListener('load', () => fetchAlumni('map'));
</script>

{% endblock %}
